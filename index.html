<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متوسطة أوس بن ثابت - منصة رفع الأعذار</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #1a237e;
            --secondary-color: #c5a059;
            --bg-color: #f4f7f9;
            --white: #ffffff;
            --text-color: #333;
            --success-color: #4caf50;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: var(--white);
            max-width: 700px;
            width: 100%;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.05);
            position: relative;
            overflow: hidden;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 20px;
        }

        .logo-img {
            max-width: 140px;
            height: auto;
            margin-bottom: 10px;
            object-fit: contain;
        }

        h1 {
            font-size: 22px;
            color: var(--primary-color);
            margin-bottom: 5px;
        }

        p.subtitle {
            color: #777;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 700;
            color: #444;
            font-size: 14px;
        }

        .required-star {
            color: #e53935;
            margin-right: 3px;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #e0e0e0;
            border-radius: 10px;
            font-size: 15px;
            transition: all 0.3s;
            background: #fafafa;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--primary-color);
            background: #fff;
            box-shadow: 0 0 0 4px rgba(26, 35, 126, 0.05);
        }

        .row-group {
            display: flex;
            gap: 15px;
        }

        .row-group .form-group {
            flex: 1;
        }

        .file-upload {
            border: 2px dashed #d1d1d1;
            padding: 20px;
            text-align: center;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.3s;
            background: #fafafa;
        }

        .file-upload:hover {
            border-color: var(--primary-color);
            background: #f8f9ff;
        }

        #preview-container {
            margin-top: 15px;
            display: none;
            text-align: center;
        }

        #preview-img {
            max-width: 100%;
            max-height: 200px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .btn-submit {
            width: 100%;
            padding: 15px;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .btn-submit:hover {
            background: #283593;
            transform: translateY(-2px);
        }

        .overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.95);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .loader {
            width: 50px; height: 50px;
            border: 5px solid #f3f3f3;
            border-top: 5px solid var(--primary-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .success-icon {
            color: var(--success-color);
            font-size: 60px;
            margin-bottom: 20px;
        }

        @media (max-width: 600px) {
            .container { padding: 20px; }
            h1 { font-size: 18px; }
            .logo-img { max-width: 110px; }
            .row-group { flex-direction: column; gap: 0; }
        }
    </style>
</head>
<body>

<div class="container">
    <div id="status-overlay" class="overlay">
        <div id="loader" class="loader"></div>
        <div id="success-msg" style="display:none; text-align:center;">
            <div class="success-icon">✓</div>
            <h2>تم استلام العذر بنجاح</h2>
            <p>سيتم مراجعة الطلب وتحديث الحالة في نظام نور.</p>
            <button onclick="location.reload()" style="margin-top:20px; padding:10px 20px; border:none; background:var(--primary-color); color:white; border-radius:8px; cursor:pointer;">إرسال عذر آخر</button>
        </div>
    </div>

    <header>
        <img src="logo.png" alt="شعار متوسطة أوس بن ثابت" class="logo-img">
        <h1>متوسطة أوس بن ثابت</h1>
        <p class="subtitle">منصة رفع الأعذار الرقمية للطلاب</p>
    </header>

    <form id="excuseForm">
        <div class="form-group">
            <label>اسم الطالب الرباعي <span class="required-star">*</span></label>
            <input type="text" id="studentName" placeholder="أدخل اسم الطالب الكامل" required>
        </div>

        <div class="row-group">
            <div class="form-group">
                <label>الصف الدراسي <span class="required-star">*</span></label>
                <select id="studentGrade" required>
                    <option value="">اختر الصف</option>
                    <option>أول متوسط</option>
                    <option>ثاني متوسط</option>
                    <option>ثالث متوسط</option>
                </select>
            </div>

            <div class="form-group">
                <label>الفصل <span class="required-star">*</span></label>
                <select id="studentClass" required>
                    <option value="">اختر الفصل</option>
                    <option>1</option>
                    <option>2</option>
                    <option>3</option>
                    <option>4</option>
                    <option>5</option>
                    <option>6</option>
                </select>
            </div>
        </div>

        <div class="form-group">
            <label>تاريخ الغياب <span class="required-star">*</span></label>
            <input type="date" id="absenceDate" required>
        </div>

        <div class="form-group">
            <label>سبب الغياب <span class="required-star">*</span></label>
            <textarea id="reason" rows="3" placeholder="اشرح سبب الغياب باختصار" required></textarea>
        </div>

        <div class="form-group">
            <label>رقم جوال ولي الأمر <span class="required-star">*</span></label>
            <input type="tel" id="phone" placeholder="05xxxxxxxx" required>
        </div>

        <div class="form-group">
            <label>إرفاق صورة العذر (طبي/رسمي) <span class="required-star">*</span></label>
            <div class="file-upload" onclick="document.getElementById('fileInput').click()">
                <span id="upload-text">اضغط هنا لرفع صورة العذر أو التقرير</span>
                <input type="file" id="fileInput" accept="image/*,.pdf" style="display:none;" required onchange="previewFile()">
            </div>
            <div id="preview-container">
                <img id="preview-img" src="" alt="معاينة العذر">
            </div>
        </div>

        <button type="submit" class="btn-submit">إرسال العذر الآن</button>
    </form>
</div>

<script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbwpO6nazJATYGu1ePQaUwaAAkjngq68bGUKByQux3jgBztm8sVwi2S_hnnkOieAahxy/exec';

    function previewFile() {
        const preview = document.getElementById('preview-img');
        const fileInput = document.getElementById('fileInput');
        const uploadText = document.getElementById('upload-text');
        const file = fileInput.files[0];
        const reader = new FileReader();

        if (file) {
            uploadText.textContent = 'تم اختيار الملف: ' + file.name;
            uploadText.style.color = '#1a237e';
            uploadText.style.fontWeight = 'bold';

            reader.onloadend = function () {
                preview.src = reader.result;
                document.getElementById('preview-container').style.display = 'block';
            }
            reader.readAsDataURL(file);
        } else {
            uploadText.textContent = 'اضغط هنا لرفع صورة العذر أو التقرير';
            uploadText.style.color = '#333';
            uploadText.style.fontWeight = 'normal';
            preview.src = "";
            document.getElementById('preview-container').style.display = 'none';
        }
    }

    document.getElementById('excuseForm').addEventListener('submit', function(e) {
        e.preventDefault();

        const fileInput = document.getElementById('fileInput');
        const file = fileInput.files[0];

        if (!file) {
            alert('يرجى إرفاق صورة العذر أو التقرير الطبي لإكمال إرسال الطلب.');
            return;
        }

        const overlay = document.getElementById('status-overlay');
        const loader = document.getElementById('loader');
        const successMsg = document.getElementById('success-msg');
        
        overlay.style.display = 'flex';
        
        const sendData = (fileData, fileName) => {
            const payload = {
                studentName: document.getElementById('studentName').value,
                studentGrade: document.getElementById('studentGrade').value,
                studentClass: document.getElementById('studentClass').value,
                absenceDate: document.getElementById('absenceDate').value,
                reason: document.getElementById('reason').value,
                phone: document.getElementById('phone').value,
                fileData: fileData,
                fileName: fileName
            };

            fetch(scriptURL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            }).then(() => {
                loader.style.display = 'none';
                successMsg.style.display = 'block';
            }).catch(err => {
                alert('حدث خطأ أثناء الإرسال، حاول مجدداً');
                overlay.style.display = 'none';
            });
        };

        const reader = new FileReader();
        reader.onload = function(evt) {
            sendData(evt.target.result, file.name);
        };
        reader.readAsDataURL(file);
    });
</script>

</body>
</html>
