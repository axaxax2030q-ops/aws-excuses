<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متوسطة أوس بن ثابت - منصة رفع الأعذار</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #1a237e;
            --secondary-color: #c5a059;
            --bg-color: #f4f7f9;
            --white: #ffffff;
            --text-color: #333;
            --success-color: #4caf50;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: var(--white);
            max-width: 700px;
            width: 100%;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.05);
            position: relative;
            overflow: hidden;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 20px;
        }

        .logo-img {
            max-width: 140px;
            height: auto;
            margin-bottom: 10px;
            object-fit: contain;
        }

        h1 {
            font-size: 22px;
            color: var(--primary-color);
            margin-bottom: 5px;
        }

        p.subtitle {
            color: #777;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 700;
            color: #444;
            font-size: 14px;
        }

        .required-star {
            color: #e53935;
            margin-right: 3px;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #e0e0e0;
            border-radius: 10px;
            font-size: 15px;
            transition: all 0.3s;
            background: #fafafa;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--primary-color);
            background: #fff;
            box-shadow: 0 0 0 4px rgba(26, 35, 126, 0.05);
        }

        .row-group {
            display: flex;
            gap: 15px;
        }

        .row-group .form-group {
            flex: 1;
        }

        .file-upload {
            border: 2px dashed #d1d1d1;
            padding: 20px;
            text-align: center;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.3s;
            background: #fafafa;
        }

        .file-upload:hover {
            border-color: var(--primary-color);
            background: #f8f9ff;
        }

        #preview-container {
            margin-top: 15px;
            display: none;
            text-align: center;
        }
